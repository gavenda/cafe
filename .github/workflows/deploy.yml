name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    environment: Production
    name: Check and Register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: oven-sh/setup-bun@v2
        name: Set up bun
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun ci
      - run: bun fmt --check
        name: Format
      - run: bun check
        name: Typecheck
      # Runs canary Bun through the lint script until bun lint ships in a stable release.
      # Non-blocking so a canary change can't hold up a release.
      - run: bun lint
        name: Lint
        continue-on-error: true
      - run: |
          bun run register
        name: Register
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
  image:
    name: Build and push image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - name: Compute image tags
        id: meta
        # v4.1.2 -> latest 4.1.2 4.1 4 sha-abc1234
        run: |
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          minor="${version#*.}"
          minor="${major}.${minor%%.*}"
          echo "tags=latest ${version} ${minor} ${major} sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: redhat-actions/buildah-build@v2
        id: build-image
        name: Build image
        with:
          image: gavenda/cafe
          tags: ${{ steps.meta.outputs.tags }}
          containerfiles: ./Containerfile
          context: .
          platforms: linux/amd64
      - uses: redhat-actions/push-to-registry@v2
        name: Push to Docker Hub
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  # Tells Podman on the server to pull the new :latest and restart the service.
  # The deploy key only runs `podman auto-update` (forced command in authorized_keys),
  # and Podman rolls back on its own if the new container fails to start.
  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Roll out on server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes cafe@"$HOST"
